<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="HTTP Custom HC configuration viewer"
    >

    <title>HC Sniffer</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="background-glow"></div>

<main class="container">

    <header class="hero">

        <div class="brand">
            HC SNIFFER
        </div>

        <h1>
            Inspect your
            <span>.hc</span>
            config.
        </h1>

        <p>
            Upload file HTTP Custom, decrypt, lalu lihat
            konfigurasi dalam bentuk text.
        </p>

    </header>


    <section class="panel">

        <!-- UPLOAD -->

        <label
            class="drop-zone"
            id="dropZone"
            for="fileInput"
        >

            <input
                id="fileInput"
                type="file"
                accept=".hc"
                hidden
            >

            <div class="upload-icon">
                ↑
            </div>

            <div
                class="file-name"
                id="fileName"
            >
                Pilih file .hc
            </div>

            <div
                class="file-info"
                id="fileInfo"
            >
                atau drag & drop ke sini
            </div>

        </label>


        <!-- BUTTONS -->

        <div class="actions">

            <button
                id="sniffButton"
                class="button primary"
                disabled
            >
                SNIFF
            </button>

            <button
                id="clearButton"
                class="button secondary"
                type="button"
            >
                CLEAR
            </button>

        </div>


        <!-- STATUS -->

        <div
            id="status"
            class="status"
            aria-live="polite"
        ></div>


        <!-- RESULT -->

        <section
            id="resultSection"
            class="result"
            hidden
        >

            <div class="result-header">

                <div>

                    <div class="result-label">
                        RESULT
                    </div>

                    <h2>
                        Decrypted text
                    </h2>

                </div>

                <button
                    id="copyButton"
                    class="copy-button"
                    type="button"
                >
                    COPY
                </button>

            </div>


            <textarea
                id="output"
                readonly
                spellcheck="false"
            ></textarea>

        </section>

    </section>


    <footer>

        <div>
            File hanya dikirim ketika tombol
            <strong>SNIFF</strong>
            ditekan.
        </div>

        <div>
            Worker tidak menyimpan file upload.
        </div>

    </footer>

</main>


<script src="./app.js"></script>

</body>
</html>
